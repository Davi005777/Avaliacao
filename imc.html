<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Avaliação</title>
    <link rel="stylesheet" href="imc.css">
</head>

<body>
    <header class="todoconteudo">
        <div class="cabecalho">
            <h1>Indice de Massa Corporal</h1>
            <br>
        </div>
        <div class="calcular">
            <p>Nome:</p>
            <input type="text" id="nome">
            <p>Peso (kg)</p>
            <input type="number" id="peso">
            <p>Altura (m)</p>
            <input type="number" id="altura">
            <br>
            <button id="botao">Calcular</button>
            <p id="mensagem">Seu IMC é: 0.00</p>
        </div>
    </header>
    <script src="imc.js" defer></script>
</body>

</html>
